name: pend_point
description: "पेंड Point — cattle-feed shop billing & stock management (Flutter + Firebase)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  provider: ^6.1.2          # state management
  intl: ^0.19.0             # number / date / ₹ formatting
  google_fonts: ^6.2.1      # Baloo 2 + Mukta (Devanagari-capable)
  qr_flutter: ^4.1.0        # QR code generation (catalogue / QR sheet)
  mobile_scanner: ^7.4.1   # ML Kit QR scanning
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  firebase_auth: ^6.6.1
  firebase_storage: ^13.5.0
  permission_handler: ^11.3.1    # runtime Bluetooth permission (Android 12+)
  unified_esc_pos_printer: ^3.4.0
  image: ^4.9.2

  # --- Firebase (backend). Uncomment after `flutterfire configure`. ---
  # firebase_core: ^3.6.0
  # cloud_firestore: ^5.4.4
  # firebase_auth: ^5.3.1
  # firebase_storage: ^12.3.4

  # --- Device features (see TODOs in code). ---
  # shared_preferences: ^2.3.2    # local settings cache

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/
